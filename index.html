<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Routine">
<meta name="theme-color" content="#2f7d5b">
<title>Daily Routine Tracker</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--mute:#6b6a65;--line:#e4e2da;--acc:#2f7d5b;--acc2:#d9efe5;--warn:#c4872a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--text:#f0efea;--mute:#9a988f;--line:#34332f;--acc:#4fb88a;--acc2:#1f3a2f;--warn:#e0a84a}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--text:#f0efea;--mute:#9a988f;--line:#34332f;--acc:#4fb88a;--acc2:#1f3a2f;--warn:#e0a84a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0}
.sub{color:var(--mute);font-size:13px}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;width:38px;height:38px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.stats{display:flex;gap:10px}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.week{display:flex;justify-content:space-between;gap:4px}
.day{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.dot{width:100%;aspect-ratio:1;max-width:40px;margin:4px auto 0;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text)}
.dot.ok{background:var(--acc);border-color:var(--acc);color:#fff}
.dot.part{background:var(--acc2);border-color:var(--acc)}
.dot.sel{outline:2px solid var(--warn);outline-offset:2px}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--mute);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.item.done .box{background:var(--acc);border-color:var(--acc)}
.item.done .lbl{text-decoration:line-through;color:var(--mute)}
.time{font-size:12px;color:var(--mute);min-width:84px}
.lbl{font-size:15px}
.note{font-size:12px;color:var(--mute);margin-top:12px;text-align:center}
.reset{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="title">Today</h1><div class="sub" id="sub"></div></div>
    <div class="nav"><button id="prev" aria-label="Previous day">‹</button> <button id="next" aria-label="Next day">›</button></div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><b id="pct">0%</b><span>Today</span></div>
      <div class="stat"><b id="streak">0</b><span>Day streak</span></div>
      <div class="stat"><b id="wk">0/5</b><span>Weekdays on track</span></div>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <div class="sub" style="margin-top:8px">A day counts as on track at 70% or more.</div>
  </div>

  <div class="card"><div class="week" id="week"></div></div>

  <div class="card" id="list"></div>
  <div class="note">Missed a day? Tap the dots above or use the arrows to go back and fill it in. Falling off is fine, just restart today.</div>
  <div style="text-align:center"><button class="reset" id="reset">Clear this day</button></div>
</div>

<script>
var UNI_TF=[["5:00","Up, water, get dressed"],["5:10-6:10","Dog walk"],["6:10-6:50","Shower, breakfast, pack bag"],["7:00","Leave for uni"],["8:30-9:00","Arrive, settle in, prep"],["9:00-10:00","Class"],["10:00-11:00","Deep work block"],["11:00-12:00","Class"],["12:00-12:45","Lunch"],["12:45-3:00","Study / project work"],["3:00","Head home"],["Evening","Dinner, exercise, light tasks"],["9:00-9:30","In bed"]];
var UNI_TH=[["5:00","Up, water, get dressed"],["5:10-6:10","Dog walk"],["6:10-6:50","Shower, breakfast, pack bag"],["7:00","Leave for uni"],["8:30-9:00","Arrive, settle in, prep"],["9:00-10:00","Class"],["10:00-11:00","Study block"],["11:00-12:00","Class"],["12:00-1:00","Lunch and break"],["1:00-3:00","Classes"],["3:00","Head home"],["Evening","Dinner, wind down (no deep work)"],["9:00-9:30","In bed"]];
var FREE=[["5:00-6:00","Dog walk"],["6:00-6:30","Breakfast"],["6:30-9:00","Deep work block 1"],["9:00-9:30","Break or exercise"],["9:30-12:00","Deep work block 2"],["12:00-1:00","Lunch and break"],["1:00-3:00","Lighter study / admin"],["3:00-5:00","Chores, errands, free time"],["Evening","Prep bag and clothes"],["9:00-9:30","In bed"]];
var WEEKEND=[["Morning","Dog walk"],["Any time","One study session"],["Evening","Prep for Monday"],["Night","Bed at a sensible time"]];
var NAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var LONG=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var mem={};
function sget(k){try{var v=localStorage.getItem(k);return v===null?(mem[k]||null):v}catch(e){return mem[k]||null}}
function sset(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function plan(d){var g=d.getDay();if(g==0||g==6)return WEEKEND;if(g==1||g==3)return FREE;if(g==4)return UNI_TH;return UNI_TF}
function load(d){try{return JSON.parse(sget("rt:"+ds(d))||"[]")}catch(e){return[]}}
function save(d,a){sset("rt:"+ds(d),JSON.stringify(a))}
function pct(d){var n=plan(d).length;return Math.round(load(d).length/n*100)}
function isWk(d){var g=d.getDay();return g>0&&g<6}
var today=new Date();today.setHours(12,0,0,0);
var cur=new Date(today);
function shift(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d){var g=d.getDay();return shift(d,g==0?-6:1-g)}
function streak(){var s=0,d=new Date(today);
  if(pct(d)<70)d=shift(d,-1);
  for(var i=0;i<400;i++){
    if(!isWk(d)){d=shift(d,-1);continue}
    if(pct(d)>=70){s++;d=shift(d,-1)}else break}
  return s}
function render(){
  var p=plan(cur),done=load(cur);
  document.getElementById("title").textContent=(ds(cur)==ds(today)?"Today":LONG[cur.getDay()]);
  document.getElementById("sub").textContent=LONG[cur.getDay()]+" "+cur.getDate()+"/"+(cur.getMonth()+1)+" · "+(cur.getDay()==0||cur.getDay()==6?"Weekend":(cur.getDay()==1||cur.getDay()==3?"No uni":"Uni day"));
  var pc=pct(cur);
  document.getElementById("pct").textContent=pc+"%";
  document.getElementById("fill").style.width=pc+"%";
  document.getElementById("streak").textContent=streak();
  var m=monday(cur),ok=0,wk="";
  for(var i=0;i<7;i++){
    var d=shift(m,i),q=pct(d);
    if(isWk(d)&&q>=70)ok++;
    wk+='<div class="day" data-d="'+ds(d)+'">'+NAMES[d.getDay()]+'<div class="dot '+(q>=70?"ok":(q>0?"part":""))+(ds(d)==ds(cur)?" sel":"")+'">'+(q>0?q:"")+'</div></div>';
  }
  document.getElementById("wk").textContent=ok+"/5";
  var w=document.getElementById("week");w.innerHTML=wk;
  Array.prototype.forEach.call(w.children,function(el){el.onclick=function(){var s=el.getAttribute("data-d").split("-");cur=new Date(+s[0],+s[1]-1,+s[2],12);render()}});
  var h="";
  p.forEach(function(it,i){var dn=done.indexOf(i)>-1;
    h+='<div class="item'+(dn?" done":"")+'" data-i="'+i+'"><div class="box">'+(dn?"✓":"")+'</div><div class="time">'+it[0]+'</div><div class="lbl">'+it[1]+'</div></div>'});
  var l=document.getElementById("list");l.innerHTML=h;
  Array.prototype.forEach.call(l.children,function(el){el.onclick=function(){
    var i=+el.getAttribute("data-i"),a=load(cur),j=a.indexOf(i);
    if(j>-1)a.splice(j,1);else a.push(i);save(cur,a);render()}});
}
document.getElementById("prev").onclick=function(){cur=shift(cur,-1);render()};
document.getElementById("next").onclick=function(){cur=shift(cur,1);render()};
document.getElementById("reset").onclick=function(){save(cur,[]);render()};
render();
</script>
</body>
</html>
